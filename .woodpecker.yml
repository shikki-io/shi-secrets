# ─── Woodpecker CI — shi-secrets kagami e2e ship-gate ────────────────────────
# Non-vault e2e scope: runs on every PR + push to main/develop.
# Vault-live scope: operator-machine only via scripts/beta-vault-live.sh.
# Part of Master Spec §1.4 — shi-secrets-hanko-beta cluster.
#
# ONE `when:` ONLY, and the scope name is a real scope (both fixed 2026-11-16).
# What was here before, and what it did:
#
#   1. `--scope e2e-brokerd-no-vault` — NO SUCH SCOPE. The repo registers 10,
#      and the two E2E ones are ShiSecretsBrokerProcessE2E and
#      ShiSecretsE2ETests. Every pipeline targeting main therefore failed with
#      an EMPTY LOG and no start/end timestamps: the step never executed
#      anything. Pipelines 10, 13, 14, 15, 16, 17 and 18 all died this way,
#      including 14, a plain push of the legal commit — so it was never any
#      one PR's doing.
#   2. A step-level `when:` NARROWER than the top-level one (it dropped
#      "feat/*" and "fix/*"). A push to a feature branch therefore started a
#      pipeline, skipped its only step, and reported GREEN having executed
#      nothing. That is the 0|0|0|0 silent-success shape at pipeline level,
#      and it is why (1) went unnoticed: the branches people actually push to
#      were always "passing".
#
# The duplicate filter is gone rather than widened: the comment above states
# the intent (main/develop), so the top-level `when:` now matches it and a
# feature-branch push produces NO pipeline instead of a misleading green one.
# A PR from a feature branch still runs, because a pull_request event carries
# the BASE branch.
#
# Pinned by WoodpeckerScopeExistsTests, which fails if a --scope here names a
# scope the kagami registry does not define.

when:
  event: [pull_request, push]
  branch: [main, develop]

steps:
  - name: kagami-e2e-no-vault
    image: shikki/kagami-runner:latest
    commands:
      - kagami test --strict --scope ShiSecretsBrokerProcessE2E
